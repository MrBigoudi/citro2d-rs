[package]
name = "citro2d"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
document-features = "0.2.7"
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs.git" }
ctru-sys = { git = "https://github.com/rust3ds/ctru-rs.git" }
citro2d-sys = { path = "../citro2d-sys" }
citro3d = { git = "https://github.com/rust3ds/citro3d-rs" }
citro3d-sys = { git = "https://github.com/rust3ds/citro3d-rs" }
bitfields = "1.0"

[dev-dependencies]
test-runner = { git = "https://github.com/rust3ds/ctru-rs.git" }

[package.metadata.docs.rs]
all-features = true
default-target = "armv6k-nintendo-3ds"
targs = []
cargo-args = ["-Z", "build-std"]
